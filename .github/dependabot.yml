version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - reactflow
          - uuid
      test-and-build-tooling:
        dependency-type: development
        patterns:
          - "@testing-library/*"
          - "@types/*"
          - "@vitejs/*"
          - jsdom
          - typescript
          - vite
          - vitest
    ignore:
      - dependency-name: "@testing-library/jest-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: jsdom
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
